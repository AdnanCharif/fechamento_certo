<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fechamento Certo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <section id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
      <div class="login-mark" aria-hidden="true">⛽</div>
      <h1>Fechamento Certo</h1>
      <p class="login-subtitle">Sistema de Conciliação e Fechamento de Caixa</p>
      <label for="login-email">E-mail do Gestor</label>
      <input id="login-email" type="email" autocomplete="username" required placeholder="seuemail@empresa.com.br">
      <label for="login-senha">Senha</label>
      <input id="login-senha" type="password" autocomplete="current-password" required placeholder="Sua senha">
      <div class="login-options"><label class="check-label"><input id="lembrar-me" type="checkbox"> Lembrar-me</label><a href="mailto:suporte@fechamentocerto.com">Fale com o suporte</a></div>
      <button class="primary full-width" type="submit">Entrar no Sistema</button>
      <p id="login-error" class="form-error" role="alert"></p>
      <p class="login-help">Problemas para acessar? <a href="mailto:suporte@fechamentocerto.com">Fale com o suporte</a></p>
    </form>
  </section>

  <div id="application" class="application" hidden>
    <aside class="sidebar">
      <a href="#dashboard" class="brand" data-page="dashboard"><span class="brand-icon">⛽</span><span><strong>Fechamento Certo</strong><small>POSTO &amp; CONVENIÊNCIA</small></span></a>
      <nav id="main-nav" class="main-nav" aria-label="Navegação principal">
        <button data-page="dashboard" class="nav-link active"><span>▦</span>Dashboard</button>
        <button data-page="closing" class="nav-link"><span>⊕</span>Novo Fechamento</button>
        <button data-page="history" class="nav-link"><span>◴</span>Histórico</button>
        <button data-page="machines" class="nav-link"><span>▤</span>Máquinas</button>
        <button data-page="operators" class="nav-link" id="operators-nav"><span>⚙</span>Operadores</button>
        <button data-page="settings" class="nav-link"><span>⚙</span>Configurações</button>
      </nav>
      <button class="account-card" data-page="profile"><span class="avatar" id="account-avatar">G</span><span><strong id="account-name">Gestor</strong><small>Gerente Geral</small></span></button>
      <button id="logout-button" class="logout-link">Sair da conta</button>
    </aside>
    <main class="main-content">
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="page-root"></div>
    </main>
  </div>
  <script src="/script.js" defer></script>
</body>
</html>
